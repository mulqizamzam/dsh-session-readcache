# dsh-session-readcache — advisory cold-session read cache.
# Mounts a late row; apply(ctx, config) wraps the shared sessionPersistence
# instance's list() (see lib/index.js). All knobs optional; defaults in
# lib/index.js: listTtlMs 750, listMaxStaleMs 30000, snapshotMaxAgeMs 86400000.
# Set enabled: false to neutralize the row without uninstalling.
- insert:
    - id: session-readcache
      name: dsh-session-readcache
      config:
        listTtlMs: 5000
        # A real list() scan measures ~9.7s for 3.8k logs here, so a strict TTL
        # expires before any caller can be served. Inside this window the last
        # scan is returned immediately while a refresh runs behind it.
        listMaxStaleMs: 120000
        # Boot seeding: reuse the persisted snapshot if it is younger than this.
        # 24 h, not 10 min: the row is only rewritten after a scan, so a restart
        # after an idle hour lands outside a 10 min window. Measured 2026-10-21:
        # the row was 56 min old at boot and the seed was refused, so the first
        # reply paid a full scan.
        snapshotMaxAgeMs: 86400000
